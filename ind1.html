<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Profile</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: all 0.5s ease;
            overflow: hidden;
            cursor: none; /* Hide the default cursor */
        }

        .dark-theme {
            background-color: #0b1121;
            color: #e2e8f0;
        }

        .light-theme {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Base styles for the glowing panels */
        .panel {
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease-in-out;
            transform: rotate(-1.5deg) scale(0.95);
        }
        
        /* Interactive glow effect */
        .panel::before {
            content: '';
            position: absolute;
            inset: -5px;
            z-index: -1;
            background: radial-gradient(circle, var(--glow-color, #a855f7) 0%, transparent 70%);
            opacity: var(--glow-opacity, 0);
            filter: blur(25px);
            transition: opacity 0.3s ease-in-out;
            border-radius: inherit;
        }

        /* Dynamic mouse pull effect */
        #cursor-effect {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #a855f7;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.8;
            transition: transform 0.1s ease-out, opacity 0.3s ease-in-out;
            z-index: 50;
        }
    </style>
</head>
<body class="dark-theme">

    <!-- Language and Theme Toggles -->
    <div class="fixed top-4 right-4 flex space-x-2 z-50">
        <button id="lang-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            FR
        </button>
        <button id="theme-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- The generative cursor effect -->
    <div id="cursor-effect"></div>

    <!-- Main Grid Container -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8 max-w-7xl mx-auto w-full">
            
            <!-- Panel 1: Profile Picture & Name -->
            <div id="panel-1" class="panel col-span-2 md:col-span-1 p-8 rounded-2xl shadow-xl flex flex-col items-center justify-center dark:bg-[#111827] bg-white">
                <img class="w-28 h-28 rounded-full border-4 border-white dark:border-[#0b1121] shadow-lg object-cover mb-4" src="https://placehold.co/150x150/d1d5db/374151?text=ME" alt="Profile Picture">
                <h1 id="name-surname" class="text-3xl font-bold mb-1" data-i18n="nameSurname">John Doe</h1>
                <p id="description" class="text-base text-gray-500 dark:text-gray-400" data-i18n="description">Web Developer</p>
            </div>

            <!-- Panel 2: Contact Info -->
            <div id="panel-2" class="panel p-6 rounded-2xl shadow-xl flex flex-col items-center justify-center dark:bg-[#111827] bg-white text-center">
                <h2 id="contact-title" class="text-xl font-bold mb-4" data-i18n="contactTitle">Contact Me</h2>
                <div class="flex flex-col space-y-4">
                    <a href="mailto:your_email@example.com" class="flex items-center justify-center space-x-3 text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors duration-200">
                        <i class="fas fa-envelope text-2xl"></i>
                        <span class="text-lg hidden lg:inline">Email</span>
                    </a>
                    <a href="https://t.me/your_username" class="flex items-center justify-center space-x-3 text-gray-500 dark:text-gray-400 hover:text-blue-400 dark:hover:text-blue-300 transition-colors duration-200">
                        <i class="fab fa-telegram-plane text-2xl"></i>
                        <span class="text-lg hidden lg:inline">Telegram</span>
                    </a>
                </div>
            </div>

            <!-- Panel 3: Social Media Icons -->
            <div id="panel-3" class="panel p-6 rounded-2xl shadow-xl flex flex-col items-center justify-center dark:bg-[#111827] bg-white text-center">
                <h2 id="social-title" class="text-xl font-bold mb-4" data-i18n="socialTitle">Follow Me</h2>
                <div class="flex flex-col space-y-4">
                    <a href="https://linkedin.com" class="flex items-center justify-center space-x-3 text-gray-500 dark:text-gray-400 hover:text-blue-700 dark:hover:text-blue-600 transition-colors duration-200">
                        <i class="fab fa-linkedin-in text-2xl"></i>
                        <span class="text-lg hidden lg:inline">LinkedIn</span>
                    </a>
                    <a href="https://github.com" class="flex items-center justify-center space-x-3 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors duration-200">
                        <i class="fab fa-github fa-2x"></i>
                        <span class="text-lg hidden lg:inline">GitHub</span>
                    </a>
                    <a href="https://instagram.com" class="flex items-center justify-center space-x-3 text-gray-500 dark:text-gray-400 hover:text-pink-600 dark:hover:text-pink-500 transition-colors duration-200">
                        <i class="fab fa-instagram fa-2x"></i>
                        <span class="text-lg hidden lg:inline">Instagram</span>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Language content for English and French
        const translations = {
            en: {
                nameSurname: "John Doe",
                description: "Web Developer",
                contactTitle: "Contact Me",
                socialTitle: "Follow Me"
            },
            fr: {
                nameSurname: "Jean Dupont",
                description: "Développeur Web",
                contactTitle: "Contactez-moi",
                socialTitle: "Suivez-moi"
            }
        };

        let currentLang = 'en';
        const langToggleBtn = document.getElementById('lang-toggle');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const panels = document.querySelectorAll('.panel');
        const cursorEffect = document.getElementById('cursor-effect');

        // Function to update the text content based on the selected language
        function updateContent(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        // Add an event listener to the language button to toggle the language
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'fr' : 'en';
            updateContent(currentLang);
            langToggleBtn.textContent = currentLang === 'en' ? 'FR' : 'EN';
        });

        // Add an event listener to the theme button to toggle the theme
        themeToggleBtn.addEventListener('click', () => {
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });

        // Interactive mouse effects
        document.addEventListener('mousemove', (e) => {
            // Update the position of the custom cursor
            cursorEffect.style.transform = `translate(${e.clientX - 40}px, ${e.clientY - 40}px)`;

            // Get the bounding box of each panel and adjust the glow
            panels.forEach(panel => {
                const rect = panel.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const distanceX = e.clientX - centerX;
                const distanceY = e.clientY - centerY;

                // Calculate a smooth distance to affect glow opacity
                const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);
                const maxDistance = Math.sqrt(Math.pow(window.innerWidth / 2, 2) + Math.pow(window.innerHeight / 2, 2));
                const glowOpacity = Math.max(0, 1 - distance / (maxDistance / 2.5));

                panel.style.setProperty('--glow-opacity', glowOpacity.toFixed(2));
            });
        });

        // Initial content load
        updateContent(currentLang);
    </script>
</body>
</html>
