<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vahe Mirzoyan - Certificates</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden; /* Prevents horizontal scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 2rem 0;
        }

        /* Dark Theme Styles */
        body.dark-theme {
            background-color: #0b1222;
            color: #e2e8f0;
        }
        
        /* Light Theme Styles */
        body.light-theme {
            background-color: #f0f2f5;
            color: #1a202c;
        }
        
        /* The canvas is fixed to the background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism panel styles */
        .glass-panel {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transform: translateY(0);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .dark-theme .glass-panel {
            background-color: rgba(26, 32, 44, 0.5);
        }
        .light-theme .glass-panel {
            background-color: rgba(255, 255, 255, 0.5);
        }
        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.45);
        }
        
        .social-icon {
            transition: color 0.3s ease;
        }
        .dark-theme .social-icon {
            color: #d1d5db;
        }
        .light-theme .social-icon {
            color: #4b5563;
        }
        .social-icon:hover {
            transform: scale(1.1);
        }

        /* Responsive icon sizing for mobile devices */
        @media (max-width: 768px) {
            .social-icon .fa-3x {
                font-size: 2rem;
            }
        }

        /* Added a dedicated style for the main button */
        .main-btn {
            @apply bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105;
        }
        
        /* Ensure card links are fully clickable */
        .certificate-card a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body class="dark-theme">

    <!-- The background canvas for particle animation -->
    <canvas id="particle-canvas"></canvas>

    <!-- Language and Theme Toggles -->
    <div class="fixed top-4 right-4 flex space-x-2 z-50">
        <button id="lang-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            FR
        </button>
        <button id="theme-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <!-- Main Content Container -->
    <div class="relative z-10 px-4 py-8 w-full max-w-6xl mx-auto flex flex-col items-center justify-center">
        
        <!-- Main Gallery Panel -->
        <div class="glass-panel rounded-3xl p-8 lg:p-12 text-center flex flex-col items-center shadow-2xl w-full">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-8" data-i18n="galleryTitle">My Certificates</h1>

            <!-- Certificate Gallery Grid -->
            <div id="certificate-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8 w-full max-w-5xl">
                <!-- Certificate cards will be dynamically added here by JavaScript -->
            </div>

            <!-- Button to go back to the main site -->
            <a href="https://vahemirzoyan.com" class="main-btn mt-12">
                <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="homepageButton">Go to Homepage</span>
            </a>
        </div>
    </div>

    <script>
        // Language content for English and French
        const translations = {
            en: {
                galleryTitle: "My Certificates",
                homepageButton: "Go to Homepage"
            },
            fr: {
                galleryTitle: "Mes certificats",
                homepageButton: "Aller à la page d'accueil"
            }
        };

        // --- Certificate Data Array ---
        // This is where you can add, remove, or edit your certificates.
        const certificates = [
            {
                id: 'google-cybersecurity',
                src: "https://placehold.co/400x300/2563eb/ffffff?text=GOOGLE+CYBER",
                alt: "Google Cybersecurity Professional Certificate",
                title: { en: "Google Cybersecurity Professional Certificate", fr: "Certificat professionnel en cybersécurité de Google" },
                description: { en: "Foundational skills in network security, threat detection, and data protection.", fr: "Compétences fondamentales en sécurité des réseaux, détection des menaces et protection des données." }
            },
            {
                id: 'web-development',
                src: "https://placehold.co/400x300/f59e0b/ffffff?text=WEB+DEV+CERT",
                alt: "Web Development Certificate",
                title: { en: "Web Development Certification", fr: "Certification en développement web" },
                description: { en: "Mastering HTML, CSS, JavaScript, and modern web frameworks.", fr: "Maîtrise de HTML, CSS, JavaScript et des frameworks web modernes." }
            },
            {
                id: 'data-science',
                src: "https://placehold.co/400x300/8b5cf6/ffffff?text=DATA+SCIENCE+CERT",
                alt: "Data Science Certificate",
                title: { en: "Data Science Fundamentals", fr: "Fondamentaux de la science des données" },
                description: { en: "An introduction to data analysis, machine learning, and statistical modeling.", fr: "Introduction à l'analyse de données, à l'apprentissage automatique et à la modélisation statistique." }
            }
        ];

        let currentLang = 'en';
        const langToggleBtn = document.getElementById('lang-toggle');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        
        // Function to update the text content based on the selected language
        function updateContent(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            // Update certificate details
            const certElements = document.querySelectorAll('.certificate-card');
            certElements.forEach(el => {
                const id = el.getAttribute('data-id');
                const cert = certificates.find(c => c.id === id);
                if (cert) {
                    const titleElement = el.querySelector('.cert-title');
                    const descElement = el.querySelector('.cert-description');
                    titleElement.textContent = cert.title[lang];
                    descElement.textContent = cert.description[lang];
                }
            });
        }

        // Dynamically create the certificate cards
        function createCertificateCards() {
            const grid = document.getElementById('certificate-grid');
            grid.innerHTML = ''; // Clear existing content
            certificates.forEach(cert => {
                const card = document.createElement('div');
                card.classList.add('glass-panel', 'rounded-2xl', 'overflow-hidden', 'certificate-card', 'cursor-pointer', 'transform', 'hover:scale-105', 'transition-transform', 'duration-300', 'p-4');
                card.setAttribute('data-id', cert.id);
                
                const link = document.createElement('a');
                link.href = `certificate_viewer.html?id=${cert.id}`;
                link.innerHTML = `
                    <img class="w-full h-48 object-cover object-center rounded-lg mb-4" src="${cert.src}" alt="${cert.alt}">
                    <h3 class="cert-title text-xl font-bold mb-1">${cert.title[currentLang]}</h3>
                    <p class="cert-description text-sm opacity-80">${cert.description[currentLang]}</p>
                `;
                card.appendChild(link);
                grid.appendChild(card);
            });
        }

        // Add an event listener to the language button to toggle the language
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'fr' : 'en';
            updateContent(currentLang);
            langToggleBtn.textContent = currentLang === 'en' ? 'FR' : 'EN';
        });

        // Add an event listener to the theme button to toggle the theme
        themeToggleBtn.addEventListener('click', () => {
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });

        // --- Particle Canvas Animation ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = 'rgba(126, 211, 255, ' + this.opacity + ')';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.x = Math.random() * canvas.width;
                if (this.y > canvas.height || this.y < 0) this.y = Math.random() * canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let particleCount = Math.floor((canvas.width * canvas.height) / 10000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            createCertificateCards();
            initParticles();
            animate();
            updateContent(currentLang);
        };
    </script>
</body>
</html>
