<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vahe Mirzoyan - Certificate</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden; /* Prevents horizontal scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 2rem 0;
        }

        /* Dark Theme Styles */
        body.dark-theme {
            background-color: #0b1222;
            color: #e2e8f0;
        }
        
        /* Light Theme Styles */
        body.light-theme {
            background-color: #f0f2f5;
            color: #1a202c;
        }
        
        /* The canvas is fixed to the background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism panel styles */
        .glass-panel {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transform: translateY(0);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .dark-theme .glass-panel {
            background-color: rgba(26, 32, 44, 0.5);
        }
        .light-theme .glass-panel {
            background-color: rgba(255, 255, 255, 0.5);
        }
        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.45);
        }
        
        .social-icon {
            transition: color 0.3s ease;
        }
        .dark-theme .social-icon {
            color: #d1d5db;
        }
        .light-theme .social-icon {
            color: #4b5563;
        }
        .social-icon:hover {
            transform: scale(1.1);
        }

        /* Responsive icon sizing for mobile devices */
        @media (max-width: 768px) {
            .social-icon .fa-3x {
                font-size: 2rem;
            }
        }

        /* Added a dedicated style for the main button */
        .main-btn {
            @apply bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105;
        }

        /* Modal specific styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }
        .modal.visible {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .modal-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 35px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .close-btn:hover {
            color: #ddd;
        }
    </style>
</head>
<body class="dark-theme">

    <!-- The background canvas for particle animation -->
    <canvas id="particle-canvas"></canvas>

    <!-- Language and Theme Toggles -->
    <div class="fixed top-4 right-4 flex space-x-2 z-50">
        <button id="lang-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            FR
        </button>
        <button id="theme-toggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <!-- Main Content Container -->
    <div class="relative z-10 px-4 py-8 w-full max-w-4xl mx-auto flex flex-col items-center justify-center">
        
        <!-- Main Certificate Panel -->
        <div class="glass-panel rounded-3xl p-8 lg:p-12 text-center flex flex-col items-center shadow-2xl w-full">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-4" data-i18n="certificateTitle">Certificate of Participation</h1>

            <!-- Certificate Image - Added ID and cursor for clickability -->
            <img id="certificate-img" class="w-full h-auto rounded-xl shadow-xl mb-6 cursor-pointer transform hover:scale-105 transition-transform duration-300" src="img/cert-hpc.jpg" alt="Scan of Cybersecurity Certificate from Google">
            
            <!-- Certificate Information -->
            <div class="text-left w-full max-w-lg mb-8">
                <h2 class="text-xl font-bold mb-2" data-i18n="detailsTitle">Details</h2>
                <ul class="space-y-2">
                    <li><strong class="font-semibold" data-i18n="courseLabel">Course:</strong> <span data-i18n="courseValue">Introduction to High-Performance and Cloud Computing</span></li>
                    <li><strong class="font-semibold" data-i18n="issuedLabel">Issued By:</strong> <a href="https://www.aitc.am" target="_blank" style="color: inherit; text-decoration: underline;" data-i18n="issuedValue">Armenian-Indian Center for Excellence</a></li>
                    <li><strong class="font-semibold" data-i18n="dateLabel">Date of Completion:</strong> <span data-i18n="dateValue">11 August 2023</span></li>
                </ul>
            </div>

            <!-- Button to go back to the main site -->
            <a href="certificates" class="main-btn">
                <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="homepageButton">Go to Homepage</span>
            </a>
        </div>
    </div>

    <!-- Full-screen modal for opening the photo -->
    <div id="photo-modal" class="modal">
        <span id="close-btn" class="close-btn">&times;</span>
        <img id="modal-img" class="modal-content rounded-xl" src="" alt="Full size certificate">
    </div>

    <script>
        // Language content for English and French
        const translations = {
            en: {
                certificateTitle: "Certificate of Participation",
                detailsTitle: "Details",
                courseLabel: "Course:",
                courseValue: "Introduction to High-Performance and Cloud Computing",
                issuedLabel: "Issued By:",
                issuedValue: "Armenian-Indian Center for Excellence",
                dateLabel: "Date of Completion:",
                dateValue: "11 August 2023",
                homepageButton: "See all certificates"
            },
            fr: {
                certificateTitle: "Certificat de participation",
                detailsTitle: "Détails",
                courseLabel: "Cours:",
                courseValue: "Introduction au calcul haute performance et au cloud computing",
                issuedLabel: "Délivré par:",
                issuedValue: "Centre d'excellence arméno-indien",
                dateLabel: "Date d'achèvement:",
                dateValue: "11 août 2023",
                homepageButton: "Voir tous les certificats"
            }
        };

        let currentLang = 'en';
        const langToggleBtn = document.getElementById('lang-toggle');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        
        // Function to update the text content based on the selected language
        function updateContent(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    // Check if the element is a list item and contains a strong tag
                    const strongTag = el.querySelector('strong');
                    if (strongTag) {
                        const labelKey = el.querySelector('strong').getAttribute('data-i18n');
                        const valueKey = el.querySelector('span').getAttribute('data-i18n');
                        el.innerHTML = `<strong class="font-semibold">${translations[lang][labelKey]}</strong> <span data-i18n="${valueKey}">${translations[lang][valueKey]}</span>`;
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
        }

        // Add an event listener to the language button to toggle the language
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'fr' : 'en';
            updateContent(currentLang);
            langToggleBtn.textContent = currentLang === 'en' ? 'FR' : 'EN';
        });

        // Add an event listener to the theme button to toggle the theme
        themeToggleBtn.addEventListener('click', () => {
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });

        // --- Photo Modal Functionality ---
        const certificateImg = document.getElementById('certificate-img');
        const photoModal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('close-btn');

        // Open modal when certificate image is clicked
        certificateImg.addEventListener('click', () => {
            modalImg.src = certificateImg.src;
            photoModal.classList.add('visible');
        });

        // Close modal when close button is clicked
        closeBtn.addEventListener('click', () => {
            photoModal.classList.remove('visible');
        });

        // Close modal when clicking outside the image
        photoModal.addEventListener('click', (e) => {
            if (e.target === photoModal) {
                photoModal.classList.remove('visible');
            }
        });

        // --- Particle Canvas Animation ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = 'rgba(126, 211, 255, ' + this.opacity + ')';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Loop particles when they go off-screen
                if (this.x > canvas.width || this.x < 0) this.x = Math.random() * canvas.width;
                if (this.y > canvas.height || this.y < 0) this.y = Math.random() * canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let particleCount = Math.floor((canvas.width * canvas.height) / 10000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Run the animations and initial content load
        window.onload = function() {
            initParticles();
            animate();
            updateContent(currentLang);
        };
    </script>
</body>
</html>
