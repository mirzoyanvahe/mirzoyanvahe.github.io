<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Certificates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: #f0f4f8;
    color: #333;
}

/* Header */
header {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: white;
    text-align: center;
    padding: 3rem 1rem;
    clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
}
header h1 {
    margin: 0;
    font-size: 2.5rem;
}
header p {
    margin-top: 0.5rem;
    font-size: 1.2rem;
    opacity: 0.9;
}

/* Certificate Grid */
.container {
    max-width: 1200px;
    margin: -4rem auto 2rem auto;
    padding: 0 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
}

/* Certificate Card */
.certificate {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}
.certificate:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
}
.certificate img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
}
.overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(30, 58, 138, 0.85);
    color: white;
    padding: 1rem;
    transform: translateY(100%);
    transition: transform 0.3s;
}
.certificate:hover .overlay {
    transform: translateY(0);
}
.overlay h2 {
    margin: 0 0 0.3rem 0;
    font-size: 1.2rem;
}
.overlay p {
    margin: 0;
    font-size: 0.95rem;
}

/* Lightbox */
.lightbox {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index: 999;
}
.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.lightbox .close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 2.5rem;
    color: white;
    text-decoration: none;
}
.lightbox .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 3rem;
    color: white;
    cursor: pointer;
    user-select: none;
    background: rgba(0,0,0,0.3);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
}
.lightbox .prev { left: 20px; }
.lightbox .next { right: 20px; }
</style>
</head>
<body>

<header>
<h1>My Certificates</h1>
<p>Hover for details, click to enlarge</p>
</header>

<div class="container" id="certificateGrid">
    <div class="certificate" onclick="openLightbox(0)">
        <img src="img/cert1.jpg" alt="Certificate 1">
        <div class="overlay">
            <h2>Certificate Title 1</h2>
            <p>Issued by XYZ organization on DATE</p>
        </div>
    </div>
    <div class="certificate" onclick="openLightbox(1)">
        <img src="img/cert2.jpg" alt="Certificate 2">
        <div class="overlay">
            <h2>Certificate Title 2</h2>
            <p>Issued by ABC organization on DATE</p>
        </div>
    </div>
    <!-- Add more certificates with the same structure -->
</div>

<div id="lightbox" class="lightbox">
    <a href="#" class="close-btn" onclick="closeLightbox()">&times;</a>
    <span class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</span>
    <img id="lightbox-img" src="" alt="Certificate">
    <span class="nav-btn next" onclick="changeSlide(1)">&#10095;</span>
</div>

<script>
const certificates = [
    'img/cert1.jpg',
    'img/cert2.jpg'
    // Add more image paths here
];

let currentIndex = 0;

function openLightbox(index) {
    currentIndex = index;
    document.getElementById('lightbox-img').src = certificates[currentIndex];
    document.getElementById('lightbox').style.display = 'flex';
}

function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

function changeSlide(direction) {
    currentIndex += direction;
    if(currentIndex < 0) currentIndex = certificates.length - 1;
    if(currentIndex >= certificates.length) currentIndex = 0;
    document.getElementById('lightbox-img').src = certificates[currentIndex];
}
</script>

</body>
</html>
